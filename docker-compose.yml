services:
  wechat:
    image: wechat-linux:latest
    # build: .
    container_name: wechat
    # privileged: true
    ports:
      - "5909:5909"
    network_mode: host
    volumes:
      - /dev/shm:/dev/shm
      - /home/n100/.xwechat:/home/ubuntu/.xwechat
      - /home/n100/Documents/xwechat_files:/home/ubuntu/xwechat_files
      - /home/n100/Downloads:/home/ubuntu/downloads
    environment:
      - DISPLAY=:0
      - RESOLUTION=1024x768x24
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
      - LC_ALL=zh_CN.UTF-8
      - TZ=Asia/Shanghai
    restart: unless-stopped
